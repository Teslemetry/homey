name: Homey App Release
on:
  # Opens the version PR. Merging it publishes, through the push below.
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        type: string
        description: Changelog
        required: true
  push:
    branches: [main]
    paths: [.homeycompose/app.json]

permissions:
  contents: write

jobs:
  version:
    name: Open the version PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Homey App Version
        uses: athombv/github-action-homey-app-version@master
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Push the bump and open its PR
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VERSION=$(grep -m1 '"version"' .homeycompose/app.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          BRANCH="release/v${VERSION}"

          git switch -c "$BRANCH"
          git add -A
          git commit -m "Update Homey App Version to v${VERSION}"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Update Homey App Version to v${VERSION}" \
              --body "Merging this tags v${VERSION} and publishes it to Athom as a draft."
          fi

          # main requires this check, and a push made with GITHUB_TOKEN starts no workflow of its own.
          gh workflow run homey-app-validate.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: Tag and release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag and release a new version
        id: tag
        run: |
          VERSION=$(grep -m1 '"version"' .homeycompose/app.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          TAG="v${VERSION}"

          # Any other change to app.json leaves the version, and its tag on an older commit, as they were.
          # A tag on this commit is a re-run's own, so it carries on from there.
          TAGGED=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "${TAG} is already released, nothing to publish"
            exit 0
          fi

          if [ -z "$TAGGED" ]; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" -t "$TAG" --notes "" --generate-notes
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  validate:
    name: Validate exact candidate commit
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/homey-app-validate.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: Publish Homey App
    needs: [release, validate]
    runs-on: ubuntu-latest
    # Merging the version PR is the approval; this environment only limits publishing to main.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish Homey App
        uses: athombv/github-action-homey-app-publish@master
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: URL
        run: |
          echo "Manage your app at ${{ steps.publish.outputs.url }}." >> "$GITHUB_STEP_SUMMARY"
