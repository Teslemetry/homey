<script type="application/javascript">
  Homey.setTitle("Tesla vehicle");

  function setMessage(text) {
    document.getElementById("message").textContent = text;
  }

  Homey.emit("get_repair_vehicle_status")
    .then((status) => {
      if (!status || !status.needsRepair) {
        Homey.done();
        return;
      }

      if (!status.candidateId) {
        setMessage(
          "This vehicle could not be found, and there isn't exactly one other matching vehicle available to relink it to automatically. Please contact support.",
        );
        document.getElementById("close").style.display = "inline-block";
        return;
      }

      setMessage(
        'This vehicle could not be found. Relink this device to "' +
          status.candidateName +
          '"? Its history and flows will be kept.',
      );
      const relinkButton = document.getElementById("relink");
      relinkButton.style.display = "inline-block";
      relinkButton.onclick = () => {
        relinkButton.disabled = true;
        Homey.showLoadingOverlay();
        Homey.emit("confirm_repair_vehicle", status.candidateId)
          .then(() => {
            Homey.hideLoadingOverlay();
            Homey.done();
          })
          .catch((err) => {
            Homey.hideLoadingOverlay();
            Homey.alert((err && err.message) || String(err));
            relinkButton.disabled = false;
          });
      };
    })
    .catch((err) => {
      setMessage((err && err.message) || String(err));
      document.getElementById("close").style.display = "inline-block";
    });
</script>

<p id="message">Checking vehicle binding&hellip;</p>
<button id="relink" style="display: none">Relink</button>
<button id="close" style="display: none" onclick="Homey.done()">Close</button>
